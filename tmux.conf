# Enabling colors
set -g default-terminal "xterm-256color"

# vi mode keys
set-window-option -g mode-keys vi

# Mouse :D
set -g mouse on

# Focus events enabled for terminals that support them
set -g focus-events on

# Activity monitoring on other windows
setw -g monitor-activity on

# What is this
set -g visual-activity on

# Focus events
set-option -g focus-events on

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Window
bind a last-window

# Pane killing
bind K kill-pane

# open windows in same directory
bind v split-window -v -c "#{pane_current_path}"
bind g split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Open current directory
bind o run-shell "open \"#{pane_current_path}\""

# Toggle status bar
bind-key b set-option status

# Set the history buffer limit
set-option -g history-limit 50000

# Escape time
set -s escape-time 5

# Tmux reload config
bind R source-file ~/.tmux.conf \; display "Reloaded!"

# Status bar
set-option -g status-keys vi
set-option -g status-position top

set-option -g status on
set-option -g status-interval 1
set-option -g status-justify centre

set -g status-right-length 70
set -g status-left-length 25

set -g status-left "[#S]"
set -g status-right "%l:%M:%S %p"

# status bar
set-option -g status-right-style fg=color001
set-option -g status-style fg=color0,default

# window
set-window-option -g window-status-style fg=color240
set-window-option -g window-status-current-style fg="#BEE0E4",bg=color235

# pane border
set-option -g pane-border-style fg="#3B4048"
set-option -g pane-active-border-style fg="#BEE0E4"

# message text
set-option -g message-style fg="#BEE0E4"

# clock
set-window-option -g clock-mode-colour orange

# PLUGINS (INSTALL: Prefix+I)
# ------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

