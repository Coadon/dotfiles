# Enabling colors
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ',xterm-256color:RGB'

# Remap prefix key to C-a
set -g prefix C-a

# vi mode keys
set-window-option -g mode-keys vi

# Mouse :D
set -g mouse on

# Activity monitoring on other windows
setw -g monitor-activity on
set -g visual-activity on

# Focus events
set-option -g focus-events on

# Pane killing
bind p kill-pane

# open windows in same directory
bind v split-window -v -c "#{pane_current_path}"
bind g split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Open current directory
bind a run-shell "open \"#{pane_current_path}\""

# Pane switching
bind -r h select-pane -L
bind -r l select-pane -R
bind -r k select-pane -U
bind -r j select-pane -D
unbind Down
unbind Up

# Moving window
bind -r y previous-window
bind -r u next-window

# Toggle status bar
bind-key b set-option status

# don't rename windows automatically
set-option -g allow-rename off

# Set the history buffer limit
set-option -g history-limit 1000

# Escape time
set -sg escape-time 10

# Tmux reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

### Status bar

set-option -g status-keys vi
set-option -g status-position top

set-option -g status on
set-option -g status-interval 1
set-option -g status-justify centre

set -g status-right-length 70
set -g status-left-length 25

set -g status-left "[#S]"
set -g status-right "%l:%M:%S %p"
set-option -g status-right-style fg=color001

# status bar
set-option -g status-style fg=color0,default

# window
set-window-option -g window-status-style fg="#BEE0E4"
set-window-option -g window-status-current-style fg="#262C2D",bg="#BEE0E4"

# pane border
set-option -g pane-border-style fg="#3B4048"
set-option -g pane-active-border-style fg="#BEE0E4"

# message text
set-option -g message-style fg="#BEE0E4"

# clock
set-window-option -g clock-mode-colour orange

# PLUGINS (INSTALL: Prefix+I)
# ------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

